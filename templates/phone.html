<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Phone (Получатель)</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body style="text-align: center; padding-top: 50px;">
    <h2>Страница Phone</h2>
    <div id="status" style="font-size: 24px; color: gray;">
        Ожидание клика с планшета...
    </div>

    <script>
        const socket = io();
        const statusDiv = document.getElementById('status');

        // Слушаем событие от сервера
        socket.on('update_phone', (data) => {
            statusDiv.style.color = 'green';
            statusDiv.innerText = `Клик получен! Время: ${data.time}`;
        });
    </script>
</body>
</html>

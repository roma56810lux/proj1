<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Phone (Получатель)</title>
</head>
<body style="text-align: center; padding-top: 50px;">
    <h2>Страница Phone</h2>
    <div id="status" style="font-size: 24px; color: gray;">
        Ожидание клика с планшета...
    </div>

    <script>
        setInterval(() => {
            fetch('/api/click/status')
            .then(response => response.json())
            .then(data => {
                const statusDiv = document.getElementById('status');
                if (data.clicked) {
                    statusDiv.textContent = 'Клик получен!';
                    statusDiv.style.color = 'green';
                } else {
                    statusDiv.textContent = 'Ожидание клика с планшета...';
                    statusDiv.style.color = 'gray';
                }
            })
        });
    </script>
</body>
</html>

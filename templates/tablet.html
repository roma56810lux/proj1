<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tablet (Отправитель)</title>
</head>
<body style="text-align: center; padding-top: 50px;">
    <h2>Страница Tablet</h2>
    <button id="clickBtn" style="padding: 20px 40px; font-size: 20px;">
        Нажать на планшете
    </button>

    <script>
        document.getElementById('clickBtn').addEventListener('click', () => {
            fetch('/api/click', {method: 'POST'});
        });
    </script>
</body>
</html>
